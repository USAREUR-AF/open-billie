[package]
name = "billie-translator"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Shared Rust translation boundary for Open Billie"

[dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
getrandom = "=0.2.15"
libc = "0.2"

[dev-dependencies]
prost = "=0.13.5"
roxmltree = "=0.20.0"

# Encoder path through the goat-transformers library. On by default (the cargo
# feature below); CoT and CAT062 use it unless configured, SAPIENT does not.
# The revision is a commit of the public repository; the pack and model files
# under translator/goat-transformers/ are copied from the same commit
# (tools/sync_goat_transformers_packs.py).
[dependencies.goat-transformers]
git = "https://github.com/USAREUR-AF/goat-transformers"
rev = "1b6f94af7d1dfb94a735fc2c8130a5ef1b87fb72"
optional = true

[features]
default = ["goat-transformers"]
goat-transformers = ["dep:goat-transformers"]

[[test]]
name = "goat_transformers_compare"
required-features = ["goat-transformers"]
