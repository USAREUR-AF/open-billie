[package]
name = "billie-translator"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Shared Rust translation boundary for Open Billie"

[dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
getrandom = "=0.2.15"
libc = "0.2"

[dev-dependencies]
prost = "=0.13.5"
roxmltree = "=0.20.0"

# Optional encoder path through the goat-transformers library. Off by default.
# The revision is a commit of the public repository; the pack and model files
# under translator/goat-transformers/ are copied from the same commit
# (tools/sync_goat_transformers_packs.py).
[dependencies.goat-transformers]
git = "https://github.com/USAREUR-AF/goat-transformers"
rev = "0be9fc9cf926139d7c188465e56f0320f348657a"
optional = true

[features]
default = []
goat-transformers = ["dep:goat-transformers"]

[[test]]
name = "goat_transformers_compare"
required-features = ["goat-transformers"]
