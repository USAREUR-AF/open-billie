name: Signed platform release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: "${{ github.token }}"
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Confirm tag matches platform version and create draft
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < deploy/VERSION)"
          test "$GITHUB_REF_NAME" = "v$version"
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --generate-notes

  build-and-upload:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: "${{ matrix.runner }}"
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: "${{ github.token }}"
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cargo rustc

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Test shared runtime
        run: cargo test --locked --workspace --manifest-path runtime/rust/Cargo.toml

      - name: Test Golden Path bridge and configuration validation
        run: python3 -m unittest tools.test_golden_path_bridge tools.test_golden_path_config

      - name: Build architecture-specific release
        run: bash tools/build-platform-release.sh

      - name: Sign, verify, and upload release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/*.deb dist/*.tar.gz dist/SHA256SUMS-*)
          test "${#assets[@]}" -eq 3
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          for asset in "${assets[@]}"; do
            cosign sign-blob "$asset" --bundle "$asset.sigstore.json" --yes
          done
          for asset in "${assets[@]}"; do
            cosign verify-blob "$asset" --bundle "$asset.sigstore.json" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done
          release_assets=("${assets[@]}")
          for asset in "${assets[@]}"; do release_assets+=("$asset.sigstore.json"); done
          gh release upload "$GITHUB_REF_NAME" "${release_assets[@]}" --clobber

  publish:
    needs: build-and-upload
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: "${{ github.token }}"
    steps:
      - name: Publish verified architecture-specific release assets
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
