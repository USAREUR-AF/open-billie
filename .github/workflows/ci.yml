name: CI

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-and-ansible:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned CI dependencies
        run: python -m pip install --requirement requirements-ci.txt
      - name: Run platform unit tests
        run: python -m unittest discover --start-directory tools --pattern 'test_*.py' --verbose
      - name: Install OETF Python test package
        run: python -m pip install -e 'kids/examples/oetf/packages/oetf/python[test]'
      - name: Test OETF Python decoder
        run: python -m pytest -q kids/examples/oetf/packages/oetf/python/tests
      - name: Check Python syntax
        run: python -m compileall -q deploy/bin tools
      - name: Check CLI and shell syntax
        run: |
          for script in deploy/bin/billie tools/*.sh; do
            bash -n "$script"
          done
          bash deploy/bin/billie help
      - name: Check Ansible playbook syntax
        env:
          ANSIBLE_CONFIG: deploy/platform/ansible.cfg
        run: |
          for playbook in deploy/platform/*.yml; do
            ansible-playbook --syntax-check -i deploy/platform/inventory-local.ini "$playbook"
          done
      - name: Check package pins and provenance
        run: python tools/check_release_hygiene.py
      - name: Scan tracked source for private material
        run: python tools/check_public_boundary.py

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # reviewed upstream commit
        with:
          toolchain: '1.85.1'
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path runtime/rust/Cargo.toml --all -- --check
      - name: Test translator
        run: cargo test --locked --workspace --manifest-path runtime/rust/Cargo.toml
      - name: Test OETF Rust decoder
        run: cargo test --locked --manifest-path kids/examples/oetf/packages/oetf/rust/Cargo.toml

  typescript:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: kids/examples/oetf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install from frozen lockfile
        run: npm install --global pnpm@10.0.0 && pnpm install --frozen-lockfile
      - name: Typecheck and test TypeScript packages
        run: pnpm typecheck && pnpm test

  platform-artifact:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install platform packaging tools
        run: sudo apt-get update && sudo apt-get install -y cargo rustc dpkg-dev
      - name: Build translator with Ubuntu release toolchain
        run: cargo build --locked --release --workspace --manifest-path runtime/rust/Cargo.toml
      - name: Build the allowlisted platform package
        run: bash tools/build-platform-release.sh
      - name: Audit package contents against tarball and source boundary
        run: python3 tools/check_release_artifact.py dist/*.deb dist/*.tar.gz
