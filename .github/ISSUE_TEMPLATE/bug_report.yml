name: Bug report
description: Report a reproducible problem in Open Billie.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private sensor data, packet captures, or deployment addresses in a public issue.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: 1. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Open Billie version and platform
      placeholder: 0.3.0, Ubuntu 24.04 arm64
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      description: Remove keys, certificates, internal hostnames, and real sensor data before posting.
      render: text
