# Weekly dependency updates: one grouped pull request per ecosystem.
version: 2
updates:
  - package-ecosystem: pip
    directories:
      - /
      - /kids/examples/oetf/packages/oetf/python
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    groups:
      pip:
        patterns: ["*"]

  - package-ecosystem: cargo
    directories:
      - /runtime/rust
      - /kids/examples/oetf/packages/oetf/rust
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /kids/examples/oetf
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /kids/examples/oetf
      - /tools/arm64-smoke
      - /tools/platform-builder
      - /tools/sensor-pod-sim
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    groups:
      base-images:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns: ["*"]
