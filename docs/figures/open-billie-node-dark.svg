<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 682" width="880" height="682" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, &apos;Noto Sans&apos;, Helvetica, Arial, sans-serif">
<title id="t">A kid package decodes one sensor; the Open Billie platform takes it to the fabric</title>
<desc id="d">Kid packages are scanned, validated and built for linux/amd64 or linux/arm64 on a workstation, then installed, configured and activated on a node running Ubuntu Server 24.04. On the node, the oetf example kid listens on UDP/TCP port 5100, decodes with a Python or Rust or TypeScript decoder and applies the user mapping and lookups, then hands a billie.dev/track-v2 record over the local Unix socket translator.sock to the platform 0.3.0. The platform's Rust translator and encoder write CoT, ASTERIX CAT062, SAPIENT, publish to the local Zenoh island, and an mTLS fabric client and prefix bridge carry the data to the remote fabric. The kid holds no fabric credentials.</desc>
